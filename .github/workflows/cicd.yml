name: CI/CD

on: [push, pull_request]

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — GCC
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            install_cmd: sudo apt-get update && sudo apt-get install -y cmake build-essential

          # Linux — Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            install_cmd: sudo apt-get update && sudo apt-get install -y cmake clang

          # Windows — MSVC (через Visual Studio)
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            install_cmd: echo "MSVC is pre-installed on windows-latest"

          # Windows — MinGW (GCC под Windows)
          - os: windows-latest
            compiler: mingw
            cc: gcc
            cxx: g++
            install_cmd: choco install mingw --no-progress -y

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install_cmd }}
        shell: bash

      # Шаг только для не-MSVC компиляторов: явно задаём CC и CXX
      - name: Configure CMake (GCC / Clang / MinGW)
        if: matrix.compiler != 'msvc'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release

      # Шаг только для MSVC: используем стандартный генератор Visual Studio
      - name: Configure CMake (MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B _build

      - name: Build
        run: cmake --build _build --config Release

      - name: Install
        run: cmake --build _build --config Release --target install
        env:
          DESTDIR: _install
